<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Créer un compte Admin - OCP Group</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: url("/static/images/nos talents page qui sommes nous _1_1.jpg") no-repeat center center;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-container {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 450px;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .signup-title {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
        }

        .signup-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #00a651 0%, #007a45 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
            font-size: 15px;
        }

        .form-control {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-control:focus {
            outline: none;
            border-color: #00a651;
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 166, 81, 0.1);
            transform: translateY(-1px);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #00a651 0%, #008a44 100%);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 166, 81, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 166, 81, 0.4);
        }

        .signup-links {
            text-align: center;
            margin-top: 20px;
        }

        .signup-links a {
            color: #00a651;
            text-decoration: none;
            font-weight: 500;
            margin: 0 15px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .signup-links a:hover {
            background: rgba(0, 166, 81, 0.1);
            transform: translateY(-1px);
        }

        .alert {
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid transparent;
        }

        .alert-danger {
            background: rgba(220, 53, 69, 0.1);
            border-color: rgba(220, 53, 69, 0.2);
            color: #721c24;
        }

        .back-home {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 10px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-home:hover {
            background: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
            padding-left: 5px;
        }

        .password-requirements ul {
            margin: 5px 0 0 15px;
        }

        .password-requirements li {
            margin: 2px 0;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            .logo-icon {
                width: 60px;
                height: 60px;
                font-size: 20px;
            }
            
            .signup-title {
                font-size: 24px;
            }
            
            .form-control {
                padding: 12px 15px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <a href="{% url 'home' %}" class="back-home">← Accueil</a>
    
    <div class="signup-container">
        <div class="logo-section">
            <div class="logo-icon">
                <img src="/static/images/logo.svg" alt="OCP Group">
            </div>
            <h1 class="admin-badge">Créer un compte Admin</h1>
            <p class="signup-subtitle">Accès administrateur sécurisé</p>
        </div>

        {% for message in messages %}
            <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Adresse email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" name="password" class="form-control" required>
                <div class="password-requirements">
                    <ul>
                        <li>Au moins 8 caractères</li>
                        <li>Au moins une majuscule et une minuscule</li>
                        <li>Au moins un chiffre</li>
                    </ul>
                </div>
            </div>
            
            <button type="submit" class="btn-primary">Créer le compte</button>
        </form>

        <div class="signup-links">
            <a href="{% url 'login_admin' %}">Déjà inscrit ? Se connecter</a>
        </div>
    </div>
</body>
</html>
